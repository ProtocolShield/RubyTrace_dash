<!-- Modal for Dynamic API Manager -->
<div class="modal fade" id="apiManagerModal" tabindex="-1" aria-labelledby="apiManagerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="apiManagerModalLabel">Dynamic API Manager</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="api-manager-container">
          <!-- API Manager UI will be dynamically loaded here -->
          <p>Loading API integrations...</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button id="refresh-api-manager-btn" type="button" class="btn btn-primary">Refresh</button>
      </div>
    </div>
  </div>
</div>
