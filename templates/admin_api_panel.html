<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin API Configuration Panel</title>
    <link rel="stylesheet" href="../static/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #1f2a4a 0%, #9370db 100%);
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background: rgba(31, 42, 74, 0.9);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(147, 112, 219, 0.3);
            border-bottom: 2px solid #9370db;
        }
        .navbar h1 {
            margin: 0;
            color: white;
            font-size: 2rem;
        }

        .container {
            margin: 0 auto;
            padding: 20px;
            max-width: 1200px;
        }
        .api-section {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #9370db;
            border-radius: 16px;
            background: rgba(31, 42, 74, 0.9);
            box-shadow: 0 8px 32px rgba(147, 112, 219, 0.2);
        }
        .api-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 20px;
        }
        @media (min-width: 768px) {
            .api-form {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 25px;
            }
        }
        .api-form label {
            font-weight: bold;
            margin-bottom: 5px;
            color: white;
        }
        .api-form input, .api-form select, .api-form textarea {
            padding: 10px;
            border: 1px solid #9370db;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            width: 100%;
        }
        .api-form button {
            grid-column: span 2;
            padding: 12px;
            background: linear-gradient(135deg, #9370db, #8a2be2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .api-form button:hover {
            background: linear-gradient(135deg, #8a2be2, #9370db);
            box-shadow: 0 4px 15px rgba(147, 112, 219, 0.5);
        }
        .api-list {
            margin-top: 20px;
        }
        .api-item {
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #9370db;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .api-item h4 {
            margin: 0 0 10px 0;
            color: white;
        }
        .api-item p {
            margin: 5px 0;
            color: #e0e0e0;
        }
        .api-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .api-actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-delete {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }
        .btn-delete:hover {
            background: linear-gradient(135deg, #c82333, #dc3545);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.5);
        }
        .btn-toggle {
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
        }
        .btn-toggle:hover {
            background: linear-gradient(135deg, #218838, #28a745);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.5);
        }
        .btn-disable {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: black;
        }
        .btn-disable:hover {
            background: linear-gradient(135deg, #e0a800, #ffc107);
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.5);
        }
        .btn, .btn-primary {
            padding: 12px 24px;
            background: linear-gradient(135deg, #9370db, #8a2be2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover, .btn-primary:hover {
            background: linear-gradient(135deg, #8a2be2, #9370db);
            box-shadow: 0 4px 15px rgba(147, 112, 219, 0.5);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>API Configuration Panel</h1>
        <a href="/admin" class="btn btn-primary">Dashboard</a>
    </div>
    <div class="container">
        <h2>Manage API Keys</h2>
        
        <!-- API Integration Section -->
        <div class="api-section">
            <h3>Integrate New API</h3>
            <form id="api-integration-form" class="api-form">
                <div>
                    <label for="api-name">API Name:</label>
                    <input type="text" id="api-name" name="api_name" required placeholder="e.g., wayback, openai, whois, hibp">
                </div>
                <div>
                    <label for="config">Config (JSON):</label>
                    <textarea id="config" name="config" required placeholder='{"api_key": "your_key", "other_param": "value"}'></textarea>
                </div>
                <button type="submit">Add API</button>
            </form>
        </div>

        <!-- Test API Section -->
        <div class="api-section">
            <h3>Test API</h3>
            <form id="test-api-form" class="api-form">
                <div>
                    <label for="test-api-name">API Name:</label>
                    <input type="text" id="test-api-name" name="api_name" required>
                </div>
                <div>
                    <label for="test-query">Test Query:</label>
                    <input type="text" id="test-query" name="test_query" required placeholder="test query">
                </div>
                <button type="submit">Test API</button>
            </form>
            <div id="test-result"></div>
        </div>

        <!-- Push to User Panel Section -->
        <div class="api-section">
            <h3>Push Data to User Panel</h3>
            <form id="push-data-form" class="api-form">
                <div>
                    <label for="user-id">User ID:</label>
                    <input type="text" id="user-id" name="user_id" required>
                </div>
                <div>
                    <label for="api-data">API Data (JSON):</label>
                    <textarea id="api-data" name="api_data" required placeholder='{"data": "value"}'></textarea>
                </div>
                <button type="submit">Push Data</button>
            </form>
        </div>

        <!-- Integrated APIs List -->
        <div class="api-section">
            <h3>Integrated APIs</h3>
            <div id="integrated-apis-list" class="api-list">
                <p>Loading integrated APIs...</p>
            </div>
        </div>




    </div>
    <script>
        // API Integration Form
        document.getElementById('api-integration-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await fetch('/admin/add_api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`API integrated successfully: ${result.message}`);
                    this.reset();
                    loadIntegratedAPIs();
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (error) {
                alert('Error integrating API: ' + error.message);
            }
        });

        // Test API Form
        document.getElementById('test-api-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            
            const resultDiv = document.getElementById('test-result');
            resultDiv.innerHTML = '<p>Testing API...</p>';
            
            try {
                const response = await fetch('/admin/test_api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.innerHTML = `<p style="color: green;">Test successful: ${JSON.stringify(result.test_result)}</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Test failed: ${result.error}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Error testing API: ${error.message}</p>`;
            }
        });

        // Push Data to User Panel Form
        document.getElementById('push-data-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await fetch('/admin/push_to_user_panel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`Data pushed successfully: ${result.message}`);
                    this.reset();
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (error) {
                alert('Error pushing data: ' + error.message);
            }
        });



        // Load integrated APIs
        async function loadIntegratedAPIs() {
            try {
                const response = await fetch('/api/config/integrated_apis');
                const result = await response.json();
                
                const apisList = document.getElementById('integrated-apis-list');
                
                if (result.success && Object.keys(result.integrated_apis).length > 0) {
                    let html = '';
                    for (const [service, config] of Object.entries(result.integrated_apis)) {
                        html += `
                            <div class="api-item">
                                <h4>${service}</h4>
                                <p><strong>Type:</strong> ${config.api_type}</p>
                                <p><strong>Endpoint:</strong> ${config.endpoint_url}</p>
                                <p><strong>Status:</strong> ${config.enabled ? 'Enabled' : 'Disabled'}</p>
                                <p><strong>Refresh:</strong> Every ${config.refresh_interval} minutes</p>
                                <p><strong>Priority:</strong> ${config.priority}</p>
                                <div class="api-actions">
                                    <button class="btn-toggle" onclick="toggleAPI('${service}', ${!config.enabled})">
                                        ${config.enabled ? 'Disable' : 'Enable'}
                                    </button>
                                    <button class="btn-delete" onclick="removeAPI('${service}')">Remove</button>
                                </div>
                            </div>
                        `;
                    }
                    apisList.innerHTML = html;
                } else {
                    apisList.innerHTML = '<p>No APIs integrated yet.</p>';
                }
            } catch (error) {
                document.getElementById('integrated-apis-list').innerHTML = '<p>Error loading integrated APIs.</p>';
                console.error('Error loading integrated APIs:', error);
            }
        }

        // Remove API
        async function removeAPI(service) {
            if (confirm(`Are you sure you want to remove the ${service} API?`)) {
                try {
                    const response = await fetch(`/api/config/integrate_api/${service}`, {
                        method: 'DELETE'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        alert(result.message);
                        loadIntegratedAPIs();
                    } else {
                        alert(`Error: ${result.error}`);
                    }
                } catch (error) {
                    alert('Error removing API: ' + error.message);
                }
            }
        }

        // Toggle API status
        async function toggleAPI(service, enable) {
            try {
                // First get current config
                const response = await fetch('/api/config/integrated_apis');
                const result = await response.json();
                
                if (result.success && result.integrated_apis[service]) {
                    const config = result.integrated_apis[service];
                    config.enabled = enable;
                    
                    // Update the API
                    const updateResponse = await fetch('/api/config/integrate_api', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(config)
                    });
                    
                    const updateResult = await updateResponse.json();
                    
                    if (updateResult.success) {
                        alert(`API ${enable ? 'enabled' : 'disabled'} successfully`);
                        loadIntegratedAPIs();
                    } else {
                        alert(`Error: ${updateResult.error}`);
                    }
                }
            } catch (error) {
                alert('Error toggling API: ' + error.message);
            }
        }

        // Fetch existing API keys and display them
        async function fetchApiKeys() {
            const response = await fetch('/api/config/api_keys');
            const apiKeys = await response.json();
            const apiKeysList = document.getElementById('api-keys');
            apiKeysList.innerHTML = '';
            apiKeys.forEach(api => {
                const li = document.createElement('li');
                li.textContent = `${api.service}: ${api.key_preview}`;
                apiKeysList.appendChild(li);
            });
        }



        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadIntegratedAPIs();
            fetchApiKeys();
        });
    </script>
</body>
</html>
