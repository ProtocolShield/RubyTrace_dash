<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Sources Management</title>
  <link rel="stylesheet" href="../static/styles.css" />
  <style>
    body {
      background: #5a2a9d;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #2a1a4d;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #4a3a7d;
    }
    th {
      background: #3a2a6d;
    }
    tr:hover {
      background: #4a3a7d;
    }
    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 8px;
    }
    .btn-add {
      background: #7b4de8;
      color: white;
      float: right;
      margin-bottom: 10px;
      box-shadow: 0 0 10px #7b4de8;
    }
    .btn-edit {
      background: #6a9fef;
      color: white;
    }
    .btn-delete {
      background: #e86a6a;
      color: white;
    }
    .risk-level.low {
      background: #4caf50;
      padding: 4px 8px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
    }
    .risk-level.medium {
      background: #ff9800;
      padding: 4px 8px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
    }
    .risk-level.high {
      background: #f44336;
      padding: 4px 8px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
    }
    .status.active {
      background: #4caf50;
      padding: 4px 8px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
    }
    .status.inactive {
      background: #9e9e9e;
      padding: 4px 8px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
    }
    /* Modal styles */
    #source-form-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.7);
    }
    #source-form-modal .modal-content {
      background-color: #3a2a6d;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
      color: white;
      position: relative;
    }
    #source-form-modal label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    #source-form-modal input[type="text"],
    #source-form-modal input[type="url"],
    #source-form-modal select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 4px;
      border: none;
      background: #5a3a9d;
      color: white;
    }
    #source-form-modal .modal-buttons {
      margin-top: 20px;
      text-align: right;
    }
    #source-form-modal button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 8px;
    }
    #source-form-modal .btn-save {
      background: #7b4de8;
      color: white;
    }
    #source-form-modal .btn-cancel {
      background: #9e9e9e;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Data Sources</h1>
  <button id="add-source-btn" class="btn btn-add">+ Add Source</button>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>URL</th>
        <th>Type</th>
        <th>Risk Level</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="data-sources-table-body">
      <tr><td colspan="6">Loading...</td></tr>
    </tbody>
  </table>

  <!-- Modal for Add/Edit Source -->
  <div id="source-form-modal">
    <div class="modal-content">
      <h2 id="source-form-title">Add Source</h2>
      <form id="source-form">
        <input type="hidden" id="source-id" name="id" />
        <label for="source-name">Name</label>
        <input type="text" id="source-name" name="name" required />
        <label for="source-url">URL</label>
        <input type="url" id="source-url" name="url" required />
        <label for="source-type">Type</label>
        <select id="source-type" name="source_type" required>
          <option value="forum">Forum</option>
          <option value="news">News</option>
          <option value="pastebin">Pastebin</option>
          <option value="darkweb">Darkweb</option>
        </select>
        <label for="risk-level">Risk Level</label>
        <select id="risk-level" name="risk_level" required>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <label for="enabled">Status</label>
        <select id="enabled" name="enabled" required>
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>
        <div class="modal-buttons">
          <button type="submit" class="btn-save">Save</button>
          <button type="button" id="source-form-cancel-btn" class="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../static/api_dashboard.js"></script>
</body>
</html>
