<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Bot Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #6a0dad;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .navbar {
            background: linear-gradient(180deg, #1f2a4a 0%, #17203d 100%) !important;
            border-bottom: 2px solid #9370db;
        }
        
        .card {
            background: rgba(31, 42, 74, 0.9);
            border: 1px solid #9370db;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: #e0e0e0;
        }
        
        .card-header {
            background: linear-gradient(135deg, #1f2a4a 0%, #2d3748 100%);
            border-bottom: 1px solid #9370db;
            color: #ffffff;
        }
        
        .bot-card {
            transition: all 0.3s ease;
            border-left: 4px solid #9370db;
            background: rgba(31, 42, 74, 0.9);
            color: #e0e0e0;
        }
        
        .bot-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(147, 112, 219, 0.3);
            background: rgba(31, 42, 74, 0.95);
        }
        
        .bot-status {
            font-size: 0.9em;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-weight: 600;
        }
        
        .status-running { background: linear-gradient(135deg, #48bb78, #38a169); color: #ffffff; }
        .status-stopped { background: linear-gradient(135deg, #f56565, #e53e3e); color: #ffffff; }
        .status-paused { background: linear-gradient(135deg, #ed8936, #dd6b20); color: #ffffff; }
        .status-error { background: linear-gradient(135deg, #f56565, #e53e3e); color: #ffffff; }
        
        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            padding: 0.5rem;
            border-bottom: 1px solid #9370db;
            background: rgba(31, 42, 74, 0.7);
            color: #e0e0e0;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        
        .log-entry:hover {
            background: rgba(31, 42, 74, 0.9);
            transform: translateX(4px);
        }
        
        .metric-card {
            background: linear-gradient(135deg, #1f2a4a 0%, #9370db 100%);
            color: white;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #9370db;
            box-shadow: 0 8px 32px rgba(147, 112, 219, 0.3);
        }
        
        .data-source-item {
            border: 1px solid #9370db;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: rgba(31, 42, 74, 0.8);
            color: #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .data-source-item:hover {
            background: rgba(31, 42, 74, 0.95);
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(147, 112, 219, 0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #9370db, #8a2be2);
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(147, 112, 219, 0.3);
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #8a2be2, #9370db);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(147, 112, 219, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #48bb78, #38a169);
            border: none;
            border-radius: 8px;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #ed8936, #dd6b20);
            border: none;
            border-radius: 8px;
        }
        
        .btn-info {
            background: linear-gradient(135deg, #4299e1, #3182ce);
            border: none;
            border-radius: 8px;
        }
        
        .btn-outline-danger {
            border-color: #f56565;
            color: #f56565;
        }
        
        .btn-outline-danger:hover {
            background: #f56565;
            color: #ffffff;
        }
        
        .nav-tabs .nav-link {
            color: #9370db;
            border: none;
            border-radius: 8px 8px 0 0;
            margin-right: 4px;
        }
        
        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, #1f2a4a 0%, #9370db 100%);
            color: #ffffff;
            border: none;
        }
        
        .nav-tabs .nav-link:hover {
            background: rgba(147, 112, 219, 0.1);
            color: #9370db;
        }
        
        .form-control, .form-select {
            background: rgba(31, 42, 74, 0.8);
            border: 1px solid #9370db;
            color: #e0e0e0;
            border-radius: 8px;
        }
        
        .form-control:focus, .form-select:focus {
            background: rgba(31, 42, 74, 0.9);
            border-color: #8a2be2;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(147, 112, 219, 0.25);
        }
        
        .badge {
            border-radius: 12px;
            padding: 0.5rem 0.75rem;
            font-weight: 600;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .tab-content {
            min-height: 400px;
        }
        
        h1, h2, h3, h4, h5, h6 {
            color: #ffffff;
            font-weight: 600;
        }
        
        .text-muted {
            color: #b19cd9 !important;
        }
        
        /* Modal Styling for Better Visibility */
        .modal-content {
            background: rgba(31, 42, 74, 0.95);
            border: 1px solid #9370db;
            border-radius: 12px;
        }
        
        .modal-header {
            background: linear-gradient(135deg, #1f2a4a 0%, #9370db 100%);
            border-bottom: 1px solid #9370db;
            border-radius: 12px 12px 0 0;
        }
        
        .modal-title {
            color: #ffffff;
        }
        
        .modal-body {
            background: rgba(31, 42, 74, 0.95);
        }
        
        .modal-footer {
            background: rgba(31, 42, 74, 0.95);
            border-top: 1px solid #9370db;
            border-radius: 0 0 12px 12px;
        }
        
        .form-label {
            color: #ffffff !important;
            font-weight: 600;
        }
        
        .form-check-label {
            color: #ffffff !important;
        }
        
                 .modal .btn-close {
             filter: invert(1);
         }
         
         /* Modal tab styling */
         .modal .nav-tabs .nav-link {
             color: #9370db;
             border: none;
             border-radius: 8px 8px 0 0;
             margin-right: 4px;
             background: rgba(31, 42, 74, 0.8);
         }
         
         .modal .nav-tabs .nav-link.active {
             background: linear-gradient(135deg, #1f2a4a 0%, #9370db 100%);
             color: #ffffff;
             border: none;
         }
         
         .modal .nav-tabs .nav-link:hover {
             background: rgba(147, 112, 219, 0.1);
             color: #9370db;
         }
         
         /* Modal content styling */
         .modal .tab-content {
             background: rgba(31, 42, 74, 0.95);
             border-radius: 8px;
             padding: 15px;
         }
         
         .modal .tab-pane {
             color: #e0e0e0;
         }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="/admin">
                            <i class="fas fa-robot"></i> OSINT Bot Management
                        </a>
                        <div class="navbar-nav ms-auto">
                            <a class="nav-link" href="/admin">
                                <i class="fas fa-arrow-left"></i> Back to Admin
                            </a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2><i class="fas fa-cogs"></i> Bot Control Center</h2>
                    <button class="btn btn-primary" onclick="refreshAllData()">
                        <i class="fas fa-sync-alt"></i> Refresh All
                    </button>
                </div>
            </div>
        </div>

        <!-- Bot Status Overview -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-chart-line"></i> System Overview</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="system-metrics">
                            <div class="col-md-3">
                                <div class="metric-card text-center">
                                    <h4 id="total-bots">4</h4>
                                    <p>Total Bots</p>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="metric-card text-center">
                                    <h4 id="running-bots">0</h4>
                                    <p>Running</p>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="metric-card text-center">
                                    <h4 id="total-sources">0</h4>
                                    <p>Data Sources</p>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="metric-card text-center">
                                    <h4 id="total-data">0</h4>
                                    <p>Data Points</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bot Management Tabs -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <ul class="nav nav-tabs card-header-tabs" id="botTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="bots-tab" data-bs-toggle="tab" data-bs-target="#bots" type="button" role="tab">
                                    <i class="fas fa-robot"></i> Bot Status
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="sources-tab" data-bs-toggle="tab" data-bs-target="#sources" type="button" role="tab">
                                    <i class="fas fa-database"></i> Data Sources
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="logs-tab" data-bs-toggle="tab" data-bs-target="#logs" type="button" role="tab">
                                    <i class="fas fa-list-alt"></i> Bot Logs
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="data-tab" data-bs-toggle="tab" data-bs-target="#data" type="button" role="tab">
                                    <i class="fas fa-chart-bar"></i> Collected Data
                                </button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body">
                        <div class="tab-content" id="botTabsContent">
                            <!-- Bot Status Tab -->
                            <div class="tab-pane fade show active" id="bots" role="tabpanel">
                                <div class="row" id="bot-cards">
                                    <!-- Bot cards will be populated here -->
                                </div>
                            </div>

                            <!-- Data Sources Tab -->
                            <div class="tab-pane fade" id="sources" role="tabpanel">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5>Data Sources Configuration</h5>
                                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addSourceModal">
                                        <i class="fas fa-plus"></i> Add Source
                                    </button>
                                </div>
                                <div id="data-sources-list">
                                    <!-- Data sources will be populated here -->
                                </div>
                            </div>

                            <!-- Bot Logs Tab -->
                            <div class="tab-pane fade" id="logs" role="tabpanel">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5>Bot Activity Logs</h5>
                                    <div>
                                        <select class="form-select d-inline-block w-auto me-2" id="log-filter">
                                            <option value="all">All Bots</option>
                                            <option value="surface">Surface Web</option>
                                            <option value="deep">Deep Web</option>
                                            <option value="dark">Dark Web</option>
                                            <option value="osint">OSINT Feeds</option>
                                        </select>
                                        <button class="btn btn-outline-secondary" onclick="refreshLogs()">
                                            <i class="fas fa-sync-alt"></i> Refresh
                                        </button>
                                    </div>
                                </div>
                                <div id="bot-logs" style="max-height: 500px; overflow-y: auto;">
                                    <!-- Logs will be populated here -->
                                </div>
                            </div>

                            <!-- Collected Data Tab -->
                            <div class="tab-pane fade" id="data" role="tabpanel">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5>📊 Collected Data - Full Content View</h5>
                                    <div>
                                        <select class="form-select d-inline-block w-auto me-2" id="data-filter">
                                            <option value="all">All Sources</option>
                                            <option value="surface_web">Surface Web</option>
                                            <option value="deep_web">Deep Web</option>
                                            <option value="dark_web">Dark Web</option>
                                            <option value="osint_feed">OSINT Feeds</option>
                                        </select>
                                        <button class="btn btn-outline-secondary me-2" onclick="refreshDataStats()">
                                            <i class="fas fa-sync-alt"></i> Refresh Stats
                                        </button>
                                        <button class="btn btn-primary" onclick="loadRawData()">
                                            <i class="fas fa-database"></i> View Full Data
                                        </button>
                                    </div>
                                </div>
                                
                                <!-- Data Statistics -->
                                <div id="data-stats" class="mb-4">
                                    <!-- Data statistics will be populated here -->
                                </div>
                                
                                <!-- Search and Filter -->
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <div class="input-group">
                                            <input type="text" class="form-control" id="data-search" placeholder="Search collected data...">
                                            <button class="btn btn-outline-secondary" onclick="searchData()">
                                                <i class="fas fa-search"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="d-flex justify-content-end">
                                            <select class="form-select w-auto me-2" id="data-sort">
                                                <option value="newest">Newest First</option>
                                                <option value="oldest">Oldest First</option>
                                                <option value="risk-high">High Risk First</option>
                                                <option value="content-length">Longest Content</option>
                                            </select>
                                            <select class="form-select w-auto" id="data-per-page">
                                                <option value="10">10 per page</option>
                                                <option value="20" selected>20 per page</option>
                                                <option value="50">50 per page</option>
                                                <option value="100">100 per page</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Raw Data Display -->
                                <div id="raw-data-container">
                                    <div class="text-center py-4">
                                        <i class="fas fa-database fa-3x text-muted mb-3"></i>
                                        <p class="text-muted">Click "View Full Data" to see collected content</p>
                                    </div>
                                </div>
                                
                                <!-- Pagination -->
                                <div id="data-pagination" class="d-flex justify-content-between align-items-center mt-3">
                                    <!-- Pagination will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Source Modal -->
    <div class="modal fade" id="addSourceModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Data Source</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addSourceForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Name</label>
                                    <input type="text" class="form-control" name="name" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">URL</label>
                                    <input type="url" class="form-control" name="url" required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">Source Type</label>
                                    <select class="form-select" name="source_type" required>
                                        <option value="surface">Surface Web</option>
                                        <option value="deep">Deep Web</option>
                                        <option value="dark">Dark Web</option>
                                        <option value="osint">OSINT Feed</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">Category</label>
                                    <select class="form-select" name="category" required>
                                        <option value="news">News</option>
                                        <option value="forum">Forum</option>
                                        <option value="paste">Paste Site</option>
                                        <option value="social">Social Media</option>
                                        <option value="market">Marketplace</option>
                                        <option value="blog">Blog</option>
                                        <option value="repo">Repository</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">Risk Level</label>
                                    <select class="form-select" name="risk_level" required>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                        <option value="critical">Critical</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Scrape Interval (minutes)</label>
                                    <input type="number" class="form-control" name="scrape_interval" value="60" min="1">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <div class="form-check mt-4">
                                        <input class="form-check-input" type="checkbox" name="enabled" checked>
                                        <label class="form-check-label">Enabled</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addDataSource()">Add Source</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global variables
        let botData = {};
        let dataSources = [];
        let botLogs = [];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            refreshAllData();
            // Auto-refresh every 30 seconds
            setInterval(refreshAllData, 30000);
        });

        async function refreshAllData() {
            await Promise.all([
                refreshBotStatus(),
                refreshDataSources(),
                refreshLogs(),
                refreshDataStats()
            ]);
        }

        async function refreshBotStatus() {
            try {
                const response = await fetch('/api/bots');
                const data = await response.json();
                
                if (data.success) {
                    botData = data.bots;
                    updateBotCards();
                    updateSystemMetrics();
                }
            } catch (error) {
                console.error('Error fetching bot status:', error);
            }
        }

        function updateBotCards() {
            const container = document.getElementById('bot-cards');
            container.innerHTML = '';

            const botTypes = [
                { key: 'surface', name: 'Surface Web Bot', icon: 'fas fa-globe', color: '#007bff' },
                { key: 'deep', name: 'Deep Web Bot', icon: 'fas fa-search', color: '#6f42c1' },
                { key: 'dark', name: 'Dark Web Bot', icon: 'fas fa-moon', color: '#343a40' },
                { key: 'osint', name: 'OSINT Feed Bot', icon: 'fas fa-rss', color: '#28a745' }
            ];

            botTypes.forEach(bot => {
                const status = botData[bot.key] || { status: 'stopped', last_run: null, data_collected: 0 };
                const card = createBotCard(bot, status);
                container.appendChild(card);
            });
        }

        function createBotCard(bot, status) {
            const div = document.createElement('div');
            div.className = 'col-md-6 col-lg-3 mb-3';
            div.innerHTML = `
                <div class="card bot-card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <h5 class="card-title">
                                    <i class="${bot.icon}" style="color: ${bot.color}"></i>
                                    ${bot.name}
                                </h5>
                                <span class="bot-status status-${status.status}">${status.status.toUpperCase()}</span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <small class="text-muted">
                                <i class="fas fa-clock"></i> Last Run: ${status.last_run || 'Never'}
                            </small>
                        </div>
                        <div class="mb-3">
                            <small class="text-muted">
                                <i class="fas fa-database"></i> Data Collected: ${status.data_collected || 0}
                            </small>
                        </div>
                        <div class="btn-group w-100" role="group">
                            <button class="btn btn-sm btn-success" onclick="startBot('${bot.key}')" ${status.status === 'running' ? 'disabled' : ''}>
                                <i class="fas fa-play"></i> Start
                            </button>
                            <button class="btn btn-sm btn-warning" onclick="stopBot('${bot.key}')" ${status.status === 'stopped' ? 'disabled' : ''}>
                                <i class="fas fa-stop"></i> Stop
                            </button>
                            <button class="btn btn-sm btn-info" onclick="runCycle('${bot.key}')">
                                <i class="fas fa-sync-alt"></i> Run Cycle
                            </button>
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        function updateSystemMetrics() {
            const runningCount = Object.values(botData).filter(bot => bot.status === 'running').length;
            document.getElementById('running-bots').textContent = runningCount;
            document.getElementById('total-bots').textContent = '4';
        }

        async function startBot(botType) {
            try {
                const response = await fetch(`/api/bots/${botType}/start`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    showAlert('success', `${botType} bot started successfully`);
                    setTimeout(refreshBotStatus, 2000);
                } else {
                    showAlert('danger', `Failed to start ${botType} bot: ${data.error}`);
                }
            } catch (error) {
                showAlert('danger', `Error starting ${botType} bot: ${error.message}`);
            }
        }

        async function stopBot(botType) {
            try {
                const response = await fetch(`/api/bots/${botType}/stop`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    showAlert('success', `${botType} bot stopped successfully`);
                    setTimeout(refreshBotStatus, 2000);
                } else {
                    showAlert('danger', `Failed to stop ${botType} bot: ${data.error}`);
                }
            } catch (error) {
                showAlert('danger', `Error stopping ${botType} bot: ${error.message}`);
            }
        }

        async function runCycle(botType) {
            try {
                const response = await fetch('/api/bots/run-cycle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bot_type: botType, source_type: botType })
                });
                const data = await response.json();
                if (data.success) {
                    showAlert('success', `Run cycle started for ${botType} bot`);
                    setTimeout(refreshBotStatus, 5000);
                } else {
                    showAlert('danger', `Failed to run cycle for ${botType} bot: ${data.error}`);
                }
            } catch (error) {
                showAlert('danger', `Error running cycle for ${botType} bot: ${error.message}`);
            }
        }

        async function refreshDataSources() {
            try {
                const response = await fetch('/api/datasources');
                const data = await response.json();
                
                if (data.success) {
                    dataSources = data.sources || [];
                    updateDataSourcesList();
                    document.getElementById('total-sources').textContent = dataSources.length;
                }
            } catch (error) {
                console.error('Error fetching data sources:', error);
            }
        }

        function updateDataSourcesList() {
            const container = document.getElementById('data-sources-list');
            if (dataSources.length === 0) {
                container.innerHTML = '<div class="text-center text-muted">No data sources configured</div>';
                return;
            }

            container.innerHTML = dataSources.map(source => `
                <div class="data-source-item">
                    <div class="row align-items-center">
                        <div class="col-md-3">
                            <strong>${source.name}</strong>
                            <br><small class="text-muted">${source.url}</small>
                        </div>
                        <div class="col-md-2">
                            <span class="badge bg-primary">${source.source_type}</span>
                            <span class="badge bg-secondary">${source.category}</span>
                        </div>
                        <div class="col-md-2">
                            <span class="badge bg-${getRiskColor(source.risk_level)}">${source.risk_level}</span>
                        </div>
                        <div class="col-md-2">
                            <small class="text-muted">
                                Interval: ${source.scrape_interval}m<br>
                                Last: ${source.last_scraped || 'Never'}
                            </small>
                        </div>
                        <div class="col-md-2">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" ${source.enabled ? 'checked' : ''} 
                                       onchange="toggleDataSource(${source.id}, this.checked)">
                            </div>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteDataSource(${source.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getRiskColor(risk) {
            const colors = { low: 'success', medium: 'warning', high: 'danger', critical: 'dark' };
            return colors[risk] || 'secondary';
        }

        async function addDataSource() {
            const form = document.getElementById('addSourceForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.enabled = formData.get('enabled') === 'on';

            try {
                const response = await fetch('/api/datasources', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.success) {
                    showAlert('success', 'Data source added successfully');
                    bootstrap.Modal.getInstance(document.getElementById('addSourceModal')).hide();
                    form.reset();
                    refreshDataSources();
                } else {
                    showAlert('danger', `Failed to add data source: ${result.error}`);
                }
            } catch (error) {
                showAlert('danger', `Error adding data source: ${error.message}`);
            }
        }

        async function toggleDataSource(id, enabled) {
            try {
                const response = await fetch(`/api/datasources/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });
                const result = await response.json();
                
                if (result.success) {
                    showAlert('success', `Data source ${enabled ? 'enabled' : 'disabled'} successfully`);
                } else {
                    showAlert('danger', `Failed to update data source: ${result.error}`);
                }
            } catch (error) {
                showAlert('danger', `Error updating data source: ${error.message}`);
            }
        }

        async function deleteDataSource(id) {
            if (!confirm('Are you sure you want to delete this data source?')) return;
            
            try {
                const response = await fetch(`/api/datasources/${id}`, { method: 'DELETE' });
                const result = await response.json();
                
                if (result.success) {
                    showAlert('success', 'Data source deleted successfully');
                    refreshDataSources();
                } else {
                    showAlert('danger', `Failed to delete data source: ${result.error}`);
                }
            } catch (error) {
                showAlert('danger', `Error deleting data source: ${error.message}`);
            }
        }

        async function refreshLogs() {
            try {
                const filter = document.getElementById('log-filter').value;
                const response = await fetch('/api/bot-logs');
                const data = await response.json();
                
                if (data.success) {
                    botLogs = data.logs || [];
                    updateLogsDisplay(filter);
                }
            } catch (error) {
                console.error('Error fetching logs:', error);
            }
        }

        function updateLogsDisplay(filter) {
            const container = document.getElementById('bot-logs');
            let filteredLogs = botLogs;
            
            if (filter !== 'all') {
                filteredLogs = botLogs.filter(log => log.bot_type === filter);
            }

            if (filteredLogs.length === 0) {
                container.innerHTML = '<div class="text-center text-muted">No logs available</div>';
                return;
            }

            container.innerHTML = filteredLogs.map(log => `
                <div class="log-entry">
                    <div class="d-flex justify-content-between">
                        <span><strong>${log.bot_name}</strong> (${log.bot_type})</span>
                        <small class="text-muted">${new Date(log.timestamp).toLocaleString()}</small>
                    </div>
                    <div class="text-muted">${log.message}</div>
                </div>
            `).join('');
        }

        async function refreshDataStats() {
            try {
                const response = await fetch('/api/data/stats');
                const data = await response.json();
                
                if (data.success) {
                    updateDataStats(data.stats);
                }
            } catch (error) {
                console.error('Error fetching data stats:', error);
            }
        }

        function updateDataStats(stats) {
            const container = document.getElementById('data-stats');
            container.innerHTML = `
                <div class="row">
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h3>${stats.total_entities || 0}</h3>
                                <p class="text-muted">Total Entities</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h3>${stats.total_relationships || 0}</h3>
                                <p class="text-muted">Relationships</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h3>${stats.total_raw_data || 0}</h3>
                                <p class="text-muted">Raw Data Items</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h3>${stats.last_24h || 0}</h3>
                                <p class="text-muted">Last 24 Hours</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('total-data').textContent = (stats.total_entities || 0) + (stats.total_relationships || 0);
        }

        function showAlert(type, message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 5000);
        }

        // Event listeners
        document.getElementById('log-filter').addEventListener('change', function() {
            updateLogsDisplay(this.value);
        });

        // Raw Data Management
        let currentPage = 1;
        let currentData = [];
        let currentPagination = {};

        async function loadRawData() {
            try {
                const filter = document.getElementById('data-filter').value;
                const perPage = document.getElementById('data-per-page').value;
                
                const url = `/api/data/raw?page=${currentPage}&per_page=${perPage}${filter !== 'all' ? `&source_type=${filter}` : ''}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    currentData = data.data;
                    currentPagination = data.pagination;
                    displayRawData();
                    updateDataPagination();
                } else {
                    showAlert('danger', 'Failed to load raw data');
                }
            } catch (error) {
                console.error('Error loading raw data:', error);
                showAlert('danger', 'Error loading raw data');
            }
        }

        function displayRawData() {
            const container = document.getElementById('raw-data-container');
            
            if (currentData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4">
                        <i class="fas fa-database fa-3x text-muted mb-3"></i>
                        <p class="text-muted">No data collected yet. Start the bots to begin data collection.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = currentData.map(item => `
                <div class="card mb-3 data-item">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-0">
                                <i class="fas fa-file-alt me-2"></i>
                                ${item.title || 'Untitled'}
                            </h6>
                            <small class="text-muted">
                                Source: ${item.source_name} (${item.source_type}) | 
                                Bot: ${item.bot_type} | 
                                Risk: <span class="badge bg-${getRiskColor(item.risk_score)}">${item.risk_score || 0}</span>
                            </small>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-outline-primary" onclick="viewDataDetail(${item.id})">
                                <i class="fas fa-eye"></i> View Full
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <p class="text-muted mb-2">
                                    <i class="fas fa-link me-1"></i>
                                    <a href="${item.url}" target="_blank" class="text-decoration-none">${item.url}</a>
                                </p>
                                                                 <div class="content-preview" style="line-height: 1.5; word-wrap: break-word;">
                                     ${item.content_preview ? item.content_preview.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim() : 'No preview available'}
                                 </div>
                                <div class="mt-2">
                                    <small class="text-muted">
                                        <i class="fas fa-text-width me-1"></i> ${item.content_length} characters | 
                                        <i class="fas fa-calendar me-1"></i> ${new Date(item.created_at).toLocaleString()}
                                    </small>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-2">
                                    <strong>Keywords:</strong>
                                    <div class="keywords-tags">
                                        ${item.keywords ? item.keywords.split(',').map(k => `<span class="badge bg-secondary me-1">${k.trim()}</span>`).join('') : 'None'}
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <strong>Tags:</strong>
                                    <div class="tags-tags">
                                        ${item.tags ? item.tags.split(',').map(t => `<span class="badge bg-info me-1">${t.trim()}</span>`).join('') : 'None'}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateDataPagination() {
            const container = document.getElementById('data-pagination');
            const { page, pages, has_next, has_prev, total } = currentPagination;
            
            container.innerHTML = `
                <div>
                    <small class="text-muted">
                        Showing ${((page - 1) * 20) + 1} to ${Math.min(page * 20, total)} of ${total} items
                    </small>
                </div>
                <div>
                    <button class="btn btn-sm btn-outline-secondary me-2" onclick="changeDataPage(${page - 1})" ${!has_prev ? 'disabled' : ''}>
                        <i class="fas fa-chevron-left"></i> Previous
                    </button>
                    <span class="mx-2">Page ${page} of ${pages}</span>
                    <button class="btn btn-sm btn-outline-secondary ms-2" onclick="changeDataPage(${page + 1})" ${!has_next ? 'disabled' : ''}>
                        Next <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            `;
        }

        function changeDataPage(newPage) {
            if (newPage >= 1 && newPage <= currentPagination.pages) {
                currentPage = newPage;
                loadRawData();
            }
        }

        async function searchData() {
            const query = document.getElementById('data-search').value.trim();
            if (!query) {
                loadRawData();
                return;
            }

            try {
                const response = await fetch(`/api/data/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.success) {
                    currentData = data.data;
                    currentPagination = data.pagination;
                    displayRawData();
                    updateDataPagination();
                } else {
                    showAlert('danger', 'Search failed');
                }
            } catch (error) {
                console.error('Error searching data:', error);
                showAlert('danger', 'Search error');
            }
        }

        async function viewDataDetail(dataId) {
            try {
                const response = await fetch(`/api/data/raw/${dataId}`);
                const data = await response.json();
                
                if (data.success) {
                    showDataDetailModal(data.data);
                } else {
                    showAlert('danger', 'Failed to load data details');
                }
            } catch (error) {
                console.error('Error loading data detail:', error);
                showAlert('danger', 'Error loading data details');
            }
        }

        function showDataDetailModal(data) {
            const modal = document.createElement('div');
            modal.className = 'modal fade';
            modal.id = 'dataDetailModal';
            modal.innerHTML = `
                <div class="modal-dialog modal-xl">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">
                                <i class="fas fa-file-alt me-2"></i>
                                ${data.title || 'Untitled'}
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <strong>Source:</strong> ${data.source_name} (${data.source_type})<br>
                                    <strong>Bot Type:</strong> ${data.bot_type}<br>
                                    <strong>Risk Score:</strong> <span class="badge bg-${getRiskColor(data.risk_score)}">${data.risk_score || 0}</span>
                                </div>
                                <div class="col-md-6">
                                    <strong>URL:</strong> <a href="${data.url}" target="_blank">${data.url}</a><br>
                                    <strong>Collected:</strong> ${new Date(data.created_at).toLocaleString()}<br>
                                    <strong>Content Length:</strong> ${data.content ? data.content.length : 0} characters
                                </div>
                            </div>
                            
                            <ul class="nav nav-tabs" id="dataDetailTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="content-tab" data-bs-toggle="tab" data-bs-target="#content" type="button" role="tab">
                                        <i class="fas fa-file-text me-1"></i> Full Content
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="metadata-tab" data-bs-toggle="tab" data-bs-target="#metadata" type="button" role="tab">
                                        <i class="fas fa-info-circle me-1"></i> Metadata
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="html-tab" data-bs-toggle="tab" data-bs-target="#html" type="button" role="tab">
                                        <i class="fas fa-code me-1"></i> Raw HTML
                                    </button>
                                </li>
                            </ul>
                            
                            <div class="tab-content mt-3" id="dataDetailTabContent">
                                                                 <div class="tab-pane fade show active" id="content" role="tabpanel">
                                     <div class="content-display" style="max-height: 400px; overflow-y: auto; background: rgba(31, 42, 74, 0.8); padding: 15px; border-radius: 5px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e0e0e0; border: 1px solid #9370db; line-height: 1.6; word-wrap: break-word;">
                                         ${data.content ? formatContent(data.content) : 'No content available'}
                                     </div>
                                 </div>
                                 <div class="tab-pane fade" id="metadata" role="tabpanel">
                                     <div class="metadata-display">
                                         <h6 style="color: #ffffff;">Keywords:</h6>
                                         <div class="mb-3">
                                             ${data.keywords ? data.keywords.split(',').map(k => `<span class="badge bg-secondary me-1">${k.trim()}</span>`).join('') : '<span style="color: #b19cd9;">None</span>'}
                                         </div>
                                         <h6 style="color: #ffffff;">Tags:</h6>
                                         <div class="mb-3">
                                             ${data.tags ? data.tags.split(',').map(t => `<span class="badge bg-info me-1">${t.trim()}</span>`).join('') : '<span style="color: #b19cd9;">None</span>'}
                                         </div>
                                         <h6 style="color: #ffffff;">Risk Keywords:</h6>
                                         <div class="mb-3">
                                             ${data.risk_keywords ? data.risk_keywords.split(',').map(k => `<span class="badge bg-danger me-1">${k.trim()}</span>`).join('') : '<span style="color: #b19cd9;">None</span>'}
                                         </div>
                                         <h6 style="color: #ffffff;">File Information:</h6>
                                         <div class="mb-3" style="color: #e0e0e0;">
                                             <strong>File Path:</strong> ${data.file_path || 'None'}<br>
                                             <strong>File Hash:</strong> ${data.file_hash || 'None'}
                                         </div>
                                     </div>
                                 </div>
                                 <div class="tab-pane fade" id="html" role="tabpanel">
                                     <div class="html-display" style="max-height: 400px; overflow-y: auto; background: rgba(31, 42, 74, 0.8); padding: 15px; border-radius: 5px; font-family: monospace; font-size: 12px; color: #e0e0e0; border: 1px solid #9370db;">
                                         <pre style="color: #e0e0e0; margin: 0;">${data.raw_html || 'No HTML available'}</pre>
                                     </div>
                                 </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <a href="${data.url}" target="_blank" class="btn btn-primary">
                                <i class="fas fa-external-link-alt me-1"></i> Visit Source
                            </a>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            const modalInstance = new bootstrap.Modal(modal);
            modalInstance.show();
            
            modal.addEventListener('hidden.bs.modal', function() {
                modal.remove();
            });
        }

                 function getRiskColor(riskScore) {
             if (!riskScore) return 'secondary';
             if (riskScore >= 0.7) return 'danger';
             if (riskScore >= 0.4) return 'warning';
             return 'success';
         }
         
         function formatContent(content) {
             if (!content) return 'No content available';
             
             // Remove excessive whitespace and normalize line breaks
             let formatted = content
                 .replace(/\r\n/g, '\n')  // Normalize line endings
                 .replace(/\r/g, '\n')    // Handle old Mac line endings
                 .replace(/\n\s*\n\s*\n/g, '\n\n')  // Remove excessive blank lines
                 .replace(/\s{2,}/g, ' ')  // Replace multiple spaces with single space
                 .trim();  // Remove leading/trailing whitespace
             
             // Split into paragraphs and format
             const paragraphs = formatted.split('\n\n');
             
             return paragraphs.map(paragraph => {
                 if (paragraph.trim() === '') return '';
                 
                 // Clean up the paragraph
                 let cleanParagraph = paragraph
                     .replace(/\n/g, ' ')  // Replace single line breaks with spaces
                     .replace(/\s{2,}/g, ' ')  // Replace multiple spaces with single space
                     .trim();
                 
                 // Skip very short paragraphs that are likely navigation elements
                 if (cleanParagraph.length < 10 && /^[|•\-–—]/.test(cleanParagraph)) {
                     return '';
                 }
                 
                 return cleanParagraph;
             })
             .filter(p => p.length > 0)  // Remove empty paragraphs
             .map(p => `<p style="margin-bottom: 1rem;">${p}</p>`)  // Wrap in paragraph tags
             .join('');
         }

        // Event listeners for data management
        document.getElementById('data-filter').addEventListener('change', function() {
            currentPage = 1;
            loadRawData();
        });

        document.getElementById('data-per-page').addEventListener('change', function() {
            currentPage = 1;
            loadRawData();
        });

        document.getElementById('data-search').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchData();
            }
        });

        // Initialize data loading when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadRawData();
        });

        // Load data when the data tab is shown
        document.addEventListener('shown.bs.tab', function(e) {
            if (e.target.id === 'data-tab') {
                loadRawData();
            }
        });
    </script>
</body>
</html>
